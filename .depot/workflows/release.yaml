# Depot CI Migration
# Source: .github/workflows/release.yaml
#
# Changes made:
# - Rewrote .github/ path references to .depot/
# - Changed GitHub runs-on labels to their Depot equivalents

name: Release
on:
  push:
    tags:
      - "v*"
env:
  CARGO_TERM_COLOR: always
jobs:
  test:
    uses: ./.depot/workflows/ci.yml
  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross-compilation dependencies (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }} --locked
      - name: Package binary
        shell: bash
        run: |
          EXT="${{ matrix.os == 'windows-latest' && '.exe' || '' }}"
          BIN="cmdutils${EXT}"
          SRC="target/${{ matrix.target }}/release/${BIN}"
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"

          # Map target triple to clean os_arch name
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu)   OS_ARCH="linux_x64" ;;
            aarch64-unknown-linux-gnu)  OS_ARCH="linux_arm64" ;;
            x86_64-apple-darwin)        OS_ARCH="macos_x64" ;;
            aarch64-apple-darwin)       OS_ARCH="macos_arm64" ;;
            x86_64-pc-windows-msvc)     OS_ARCH="windows_x64" ;;
            aarch64-pc-windows-msvc)    OS_ARCH="windows_arm64" ;;
          esac

          PKG_DIR="cmdutils-${TAG}-${OS_ARCH}"
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            ARCHIVE="${PKG_DIR}.zip"
          else
            ARCHIVE="${PKG_DIR}.tar.gz"
          fi

          mkdir -p "${PKG_DIR}"
          cp "${SRC}" "${PKG_DIR}/${BIN}"

          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            7z a "${ARCHIVE}" "${PKG_DIR}"
          else
            tar czf "${ARCHIVE}" "${PKG_DIR}"
          fi

          echo "archive_name=${ARCHIVE}" >> "$GITHUB_OUTPUT"
        id: package
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.archive_name }}
          path: ${{ steps.package.outputs.archive_name }}
          if-no-files-found: error
  create-release:
    needs: build
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: artifacts/*/*
          generate_release_notes: true
