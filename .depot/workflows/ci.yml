# Depot CI Migration
# Source: .github/workflows/ci.yml
#
# Changes made:
# - Changed GitHub runs-on labels to their Depot equivalents

name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:
env:
  CARGO_TERM_COLOR: always
jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
      - name: Lint (clippy)
        run: cargo clippy -- -D warnings
      - name: Check formatting
        run: cargo fmt --check
  smoke-test:
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: cargo build --release
      - name: Generate test images
        run: "python3 -c \"\nimport struct, zlib\n\ndef make_png(filename, width=100, height=80):\n    raw_data = bytearray()\n    for _ in range(height):\n        raw_data.append(0)\n        raw_data.extend(b'\\x32\\x64\\xc8' * width)\n    \n    compressed = zlib.compress(raw_data)\n    \n    def chunk(tag, data):\n        return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', zlib.crc32(tag + data) & 0xffffffff)\n\n    png = b'\\x89PNG\\r\\n\\x1a\\n'\n    ihdr = struct.pack('>IIBBBBB', width, height, 8, 2, 0, 0, 0)\n    png += chunk(b'IHDR', ihdr)\n    png += chunk(b'IDAT', compressed)\n    png += chunk(b'IEND', b'')\n    \n    with open(filename, 'wb') as f:\n        f.write(png)\n\nmake_png('/tmp/test_img.png')\n\"\n./target/release/cmdutils image convert /tmp/test_img.png jpg\n"
      - name: Test image convert (PNG → JPEG)
        run: |
          set -e
          cp /tmp/test_img.png /tmp/test_convert_in.png
          ./target/release/cmdutils image convert /tmp/test_convert_in.png jpg
          [ -f /tmp/test_convert_in.jpg ] && echo "✅ convert PNG→JPEG"
      - name: Test image convert (JPEG → PNG)
        run: |
          set -e
          cp /tmp/test_img.jpg /tmp/test_convert_in2.jpg
          ./target/release/cmdutils image convert /tmp/test_convert_in2.jpg png
          [ -f /tmp/test_convert_in2.png ] && echo "✅ convert JPEG→PNG"
      - name: Test resize
        run: |
          set -e
          cp /tmp/test_img.png /tmp/test_resize_in.png
          ./target/release/cmdutils image resize /tmp/test_resize_in.png 50x40
          [ -f /tmp/test_resize_in_resized.png ] && echo "✅ resize"
      - name: Test compress
        run: |
          set -e
          cp /tmp/test_img.jpg /tmp/test_compress_in.jpg
          ./target/release/cmdutils image compress /tmp/test_compress_in.jpg 50
          [ -f /tmp/test_compress_in_compressed.jpg ] && echo "✅ compress JPEG"
