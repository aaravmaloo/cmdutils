name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Lint (clippy)
        run: cargo clippy -- -D warnings

      - name: Check formatting
        run: cargo fmt --check

  smoke-test:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Generate test images
        run: |
          python3 -c "
          import struct, zlib

          def make_png(filename, width=100, height=80):
              raw_data = bytearray()
              for _ in range(height):
                  raw_data.append(0)
                  raw_data.extend(b'\x32\x64\xc8' * width)
              
              compressed = zlib.compress(raw_data)
              
              def chunk(tag, data):
                  return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', zlib.crc32(tag + data) & 0xffffffff)

              png = b'\x89PNG\r\n\x1a\n'
              ihdr = struct.pack('>IIBBBBB', width, height, 8, 2, 0, 0, 0)
              png += chunk(b'IHDR', ihdr)
              png += chunk(b'IDAT', compressed)
              png += chunk(b'IEND', b'')
              
              with open(filename, 'wb') as f:
                  f.write(png)

          make_png('/tmp/test_img.png')
          "
          ./target/release/cmdutils image convert /tmp/test_img.png jpg

      - name: Test image convert (PNG → JPEG)
        run: |
          set -e
          cp /tmp/test_img.png /tmp/test_convert_in.png
          ./target/release/cmdutils image convert /tmp/test_convert_in.png jpg
          [ -f /tmp/test_convert_in.jpg ] && echo "✅ convert PNG→JPEG"

      - name: Test image convert (JPEG → PNG)
        run: |
          set -e
          cp /tmp/test_img.jpg /tmp/test_convert_in2.jpg
          ./target/release/cmdutils image convert /tmp/test_convert_in2.jpg png
          [ -f /tmp/test_convert_in2.png ] && echo "✅ convert JPEG→PNG"

      - name: Test resize
        run: |
          set -e
          cp /tmp/test_img.png /tmp/test_resize_in.png
          ./target/release/cmdutils image resize /tmp/test_resize_in.png 50x40
          [ -f /tmp/test_resize_in_resized.png ] && echo "✅ resize"

      - name: Test compress
        run: |
          set -e
          cp /tmp/test_img.jpg /tmp/test_compress_in.jpg
          ./target/release/cmdutils image compress /tmp/test_compress_in.jpg 50
          [ -f /tmp/test_compress_in_compressed.jpg ] && echo "✅ compress JPEG"
