name: Winget Release

on:
  release:
    types: [published]
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, like v0.0.1"
        required: true

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Resolve version
        id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          VERSION="${DISPATCH_VERSION:-$RELEASE_TAG}"

          if [ -z "$VERSION" ]; then
            VERSION=$(curl -fsSL \
              -H "Authorization: Bearer $PAT_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest" \
              | jq -r '.tag_name')
          fi

          VERSION="${VERSION#refs/tags/}"

          if [ -z "$VERSION" ] || [[ "$VERSION" != v* ]]; then
            echo "Could not resolve release tag."
            exit 1
          fi

          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish to WinGet
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: aaravmaloo.cmdutils
          installers-regex: 'cmdutils-.*-windows_(x64|arm64)\.zip$'
          release-tag: ${{ steps.version.outputs.tag }}
          token: ${{ secrets.PAT_TOKEN }}

