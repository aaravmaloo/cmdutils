name: Winget Release

on:
  release:
    types: [published]
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, like v0.0.1"
        required: true

jobs:
  submit:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          VERSION="${DISPATCH_VERSION:-$RELEASE_TAG}"
          if [ -z "$VERSION" ]; then
            VERSION=$(curl -fsSL \
              -H "Authorization: Bearer $PAT_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest" \
              | jq -r '.tag_name')
          fi
          VERSION="${VERSION#refs/tags/}"
          if [ -z "$VERSION" ] || [[ "$VERSION" != v* ]]; then
            echo "Could not resolve release tag."
            exit 1
          fi
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Download x64 Windows installer
        id: win64
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          ZIP_NAME="cmdutils-${TAG}-windows_x64.zip"
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${ZIP_NAME}"

          echo "==> Downloading ${URL}..."
          if ! curl -fSL -s "$URL" -o win64.zip; then
            echo "Primary URL failed, attempting fallback URL format..."
            ZIP_NAME="cmdutils-v${VERSION}-windows_x64.zip"
            URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${ZIP_NAME}"
            curl -fSL -s "$URL" -o win64.zip
          fi

          SHA=$(sha256sum win64.zip | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "==> SHA256: $SHA"

          unzip -o win64.zip -d extracted64
          BIN_PATH=$(find extracted64 -name 'cmdutils.exe' -type f)
          echo "bin_path=${BIN_PATH#extracted64/}" >> "$GITHUB_OUTPUT"
          echo "==> Binary inside zip: ${BIN_PATH#extracted64/}"

      - name: Download ARM64 Windows installer
        id: winArm64
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          ZIP_NAME="cmdutils-${TAG}-windows_arm64.zip"
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${ZIP_NAME}"

          echo "==> Downloading ${URL}..."
          if ! curl -fSL -s "$URL" -o winArm64.zip; then
            echo "Primary URL failed, attempting fallback URL format..."
            ZIP_NAME="cmdutils-v${VERSION}-windows_arm64.zip"
            URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${ZIP_NAME}"
            curl -fSL -s "$URL" -o winArm64.zip
          fi

          SHA=$(sha256sum winArm64.zip | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "==> SHA256: $SHA"

          unzip -o winArm64.zip -d extractedArm64
          BIN_PATH=$(find extractedArm64 -name 'cmdutils.exe' -type f)
          echo "bin_path=${BIN_PATH#extractedArm64/}" >> "$GITHUB_OUTPUT"
          echo "==> Binary inside zip: ${BIN_PATH#extractedArm64/}"

      - name: Generate Winget manifest
        id: manifest
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          RELDIR="manifests/a/aaravmaloo/cmdutils/${VERSION}"
          mkdir -p "${RELDIR}"

          # ── Version manifest ──
          cat > "${RELDIR}/aaravmaloo.cmdutils.yaml" << EOF
          PackageIdentifier: aaravmaloo.cmdutils
          PackageVersion: ${VERSION}
          DefaultLocale: en-US
          ManifestType: version
          ManifestVersion: 1.6.0
          EOF

          # ── Installer manifest ──
          cat > "${RELDIR}/aaravmaloo.cmdutils.installer.yaml" << EOF
          PackageIdentifier: aaravmaloo.cmdutils
          PackageVersion: ${VERSION}
          Installers:
          - Architecture: x64
            InstallerType: zip
            InstallerUrl: ${{ steps.win64.outputs.url }}
            InstallerSha256: ${{ steps.win64.outputs.sha256 }}
            NestedInstallerType: portable
            NestedInstallerFiles:
            - RelativeFilePath: ${{ steps.win64.outputs.bin_path }}
              PortableCommandAlias: cmdutils
          - Architecture: arm64
            InstallerType: zip
            InstallerUrl: ${{ steps.winArm64.outputs.url }}
            InstallerSha256: ${{ steps.winArm64.outputs.sha256 }}
            NestedInstallerType: portable
            NestedInstallerFiles:
            - RelativeFilePath: ${{ steps.winArm64.outputs.bin_path }}
              PortableCommandAlias: cmdutils
          ManifestType: installer
          ManifestVersion: 1.6.0
          EOF

          # ── Locale manifest ──
          cat > "${RELDIR}/aaravmaloo.cmdutils.locale.en-US.yaml" << EOF
          PackageIdentifier: aaravmaloo.cmdutils
          PackageVersion: ${VERSION}
          PackageLocale: en-US
          Publisher: Aarav Maloo
          PublisherUrl: https://github.com/aaravmaloo
          PublisherSupportUrl: https://github.com/${{ github.repository }}/issues
          PackageName: cmdutils
          PackageUrl: https://github.com/${{ github.repository }}
          License: MIT
          LicenseUrl: https://github.com/${{ github.repository }}/blob/master/LICENSE
          ShortDescription: Cross-platform CLI utilities for everyday tasks
          Description: A fast, zero-bloat CLI utility toolbox for everyday tasks like image conversion, resizing, and compression, written in Rust.
          Moniker: cmdutils
          Tags:
          - cli
          - image
          - converter
          - resize
          - compress
          - rust
          ManifestType: defaultLocale
          ManifestVersion: 1.6.0
          EOF

          echo "path=${RELDIR}" >> "$GITHUB_OUTPUT"
          echo "==> Manifests created in ${RELDIR}"

      - name: Submit to winget-pkgs
        shell: bash
        env:
          WINGET_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          # Install wingetcreate CLI tool (.NET SDK is pre-installed on ubuntu-latest)
          dotnet tool install --global wingetcreate

          # Submit the manifests (this forks winget-pkgs and opens a PR)
          wingetcreate submit \
            --manifest-path "${{ steps.manifest.outputs.path }}" \
            --token "$WINGET_TOKEN"
