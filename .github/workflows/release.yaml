name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }} --locked

      - name: Package binary
        shell: bash
        run: |
          EXT="${{ matrix.os == 'windows-latest' && '.exe' || '' }}"
          BIN="cmdutils${EXT}"
          SRC="target/${{ matrix.target }}/release/${BIN}"

          PKG_DIR="cmdutils-${{ github.ref_name }}-${{ matrix.target }}"
          IS_WIN="${{ matrix.target == 'x86_64-pc-windows-msvc' }}"
          if [ "$IS_WIN" = "true" ]; then
            ARCHIVE="${PKG_DIR}.zip"
          else
            ARCHIVE="${PKG_DIR}.tar.gz"
          fi

          mkdir -p "${PKG_DIR}"
          cp "${SRC}" "${PKG_DIR}/${BIN}"

          if [[ "${{ matrix.target }}" == "x86_64-pc-windows-msvc" ]]; then
            7z a "${ARCHIVE}" "${PKG_DIR}"
          else
            tar czf "${ARCHIVE}" "${PKG_DIR}"
          fi

          echo "archive_name=${ARCHIVE}" >> "$GITHUB_OUTPUT"
        id: package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.archive_name }}
          path: ${{ steps.package.outputs.archive_name }}
          if-no-files-found: error

  create-release:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: cmdutils ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: artifacts/*/*
          generate_release_notes: true
